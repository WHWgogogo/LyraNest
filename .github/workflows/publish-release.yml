name: Publish LyraNest release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    needs: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_DIR="releases/${VERSION}"
          NOTES_FILE="${SOURCE_DIR}/CHANGELOG.md"
          if [[ ! -f "${NOTES_FILE}" ]]; then
            NOTES_FILE="${SOURCE_DIR}/RELEASE_NOTES_zh-CN.txt"
          fi
          test -f "${NOTES_FILE}"
          assets=(
            "${SOURCE_DIR}/LyraNest-${VERSION}-android-arm64.apk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-windows-x64.zip"
            "${SOURCE_DIR}/LyraNest-${VERSION}-fnos-x86.fpk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-fnos-arm.fpk"
            "${SOURCE_DIR}/LyraNest-Compat-${VERSION}-fnos-x86.fpk"
            "${SOURCE_DIR}/LyraNest-Compat-${VERSION}-fnos-arm.fpk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-docker-linux-amd64.tar.gz"
            "${SOURCE_DIR}/LyraNest-${VERSION}-docker-linux-arm64.tar.gz"
            "docker-compose.yml"
          )
          for optional_asset in \
            "${SOURCE_DIR}/LyraNest-TV-${VERSION}-arm64-v8a.apk" \
            "${SOURCE_DIR}/LyraNest-TV-${VERSION}-armeabi-v7a.apk"; do
            if [[ -f "${optional_asset}" ]]; then
              assets+=("${optional_asset}")
            fi
          done
          for asset in "${assets[@]}"; do
            test -f "${asset}"
          done
          printf '%s\n' "${assets[@]}" > release-assets.txt
          printf 'VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"
          printf 'NOTES_FILE=%s\n' "${NOTES_FILE}" >> "${GITHUB_ENV}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "Published release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
              exit 1
            fi
            echo "Resuming existing draft ${GITHUB_REF_NAME}."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --title "LyraNest v${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' || true)"
          while IFS= read -r asset; do
            asset_name="$(basename "${asset}")"
            if printf '%s\n' "${existing_assets}" | grep -Fxq "${asset_name}"; then
              echo "Keeping existing draft asset ${asset_name}."
              continue
            fi
            echo "Uploading ${asset_name}."
            gh release upload "${GITHUB_REF_NAME}" "${asset}" --repo "${GITHUB_REPOSITORY}"
          done < release-assets.txt

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(wc -l < release-assets.txt | tr -d ' ')"
          actual="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Expected ${expected} release assets, found ${actual}." >&2
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/whwgogogo/lyranest-server:${{ steps.version.outputs.value }}
            ghcr.io/whwgogogo/lyranest-server:latest
