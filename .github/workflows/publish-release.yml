name: Publish LyraNest release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    needs: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_DIR="releases/${VERSION}"
          assets=(
            "${SOURCE_DIR}/LyraNest-${VERSION}-android-arm64.apk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-tv-arm64-v8a.apk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-tv-armeabi-v7a.apk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-windows-x64.zip"
            "${SOURCE_DIR}/LyraNest-${VERSION}-fnos-x86.fpk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-fnos-arm.fpk"
            "${SOURCE_DIR}/LyraNest-Compat-${VERSION}-fnos-x86.fpk"
            "${SOURCE_DIR}/LyraNest-Compat-${VERSION}-fnos-arm.fpk"
            "${SOURCE_DIR}/LyraNest-${VERSION}-docker-linux-amd64.tar.gz"
            "${SOURCE_DIR}/LyraNest-${VERSION}-docker-linux-arm64.tar.gz"
            "docker-compose.yml"
          )
          for asset in "${assets[@]}"; do
            test -f "${asset}"
          done
          printf '%s\n' "${assets[@]}" > release-assets.txt
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          mapfile -t assets < release-assets.txt
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --latest \
            --title "LyraNest v${VERSION}" \
            --notes-file "releases/${VERSION}/CHANGELOG.md"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/whwgogogo/lyranest-server:${{ steps.version.outputs.value }}
            ghcr.io/whwgogogo/lyranest-server:latest
